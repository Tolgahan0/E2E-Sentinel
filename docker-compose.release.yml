# Runs E2E Sentinel from pre-built images published to GHCR on each
# release tag — no repository checkout, no Go/Node toolchain, no local
# build step. See docs/QUICKSTART.md ("Running a release") and
# install.sh, which downloads exactly this file.
#
# This is the release counterpart to docker-compose.yml (which builds
# every image from source for local development) — same services, same
# volumes, same environment variables; only `build:` becomes `image:`.
name: e2e-sentinel

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set, see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
    volumes:
      - sentinel-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinel}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:6379:6379"

  artifacts-init:
    image: busybox:1.36
    command: ["chown", "-R", "65532:65532", "/data/artifacts"]
    volumes:
      - sentinel-artifacts:/data/artifacts

  fix-workspaces-init:
    image: busybox:1.36
    command: ["chown", "-R", "65532:65532", "/data/fix-workspaces"]
    volumes:
      - sentinel-fix-workspaces:/data/fix-workspaces

  sentinel-api:
    image: ${SENTINEL_IMAGE_REGISTRY:-ghcr.io/tolgahan0}/e2e-sentinel-api:${SENTINEL_VERSION:-latest}
    restart: unless-stopped
    group_add:
      - "${SENTINEL_DOCKER_GID:-0}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      artifacts-init:
        condition: service_completed_successfully
      fix-workspaces-init:
        condition: service_completed_successfully
    environment:
      SENTINEL_HTTP_ADDR: ":8080"
      SENTINEL_DATABASE_URL: "postgres://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sentinel}?sslmode=disable"
      SENTINEL_REDIS_ADDR: "redis:6379"
      # No SENTINEL_MIGRATIONS_DIR override, no ./migrations bind mount:
      # the image has its own migrations baked in at the default path
      # (see deploy/docker/Dockerfile.api) — there's no local checkout
      # to mount them from in a release install.
      SENTINEL_LOG_LEVEL: ${SENTINEL_LOG_LEVEL:-info}
      SENTINEL_ENVIRONMENT: ${SENTINEL_ENVIRONMENT:-local}
      SENTINEL_RUNNER_HOST_WORKSPACE_DIR: ${SENTINEL_RUNNER_HOST_WORKSPACE_DIR:?run via install.sh, which sets this to an absolute host path}
      # docker | local | auto (default) — see docs/RUNNER_ISOLATION.md.
      SENTINEL_EXECUTION_MODE: ${SENTINEL_EXECUTION_MODE:-auto}
      SENTINEL_RUNNER_IMAGE: ${SENTINEL_RUNNER_IMAGE:-${SENTINEL_IMAGE_REGISTRY:-ghcr.io/tolgahan0}/e2e-sentinel-playwright-runner:${SENTINEL_VERSION:-latest}}
      SENTINEL_WEBSOCKET_RUNNER_IMAGE: ${SENTINEL_WEBSOCKET_RUNNER_IMAGE:-${SENTINEL_IMAGE_REGISTRY:-ghcr.io/tolgahan0}/e2e-sentinel-websocket-runner:${SENTINEL_VERSION:-latest}}
      SENTINEL_SECRET_ENCRYPTION_KEY: ${SENTINEL_SECRET_ENCRYPTION_KEY:-}
      SENTINEL_AUTH_ENABLED: ${SENTINEL_AUTH_ENABLED:-false}
      SENTINEL_ADMIN_EMAIL: ${SENTINEL_ADMIN_EMAIL:-}
      SENTINEL_ADMIN_PASSWORD: ${SENTINEL_ADMIN_PASSWORD:-}
      SENTINEL_KUBE_CONFIG_PATH: ${SENTINEL_KUBE_CONFIG_PATH:-}
      SENTINEL_KUBE_NAMESPACE: ${SENTINEL_KUBE_NAMESPACE:-}
    volumes:
      # Target repositories to discover/test — place them under
      # ./workspace, then use /workspace/<name> as a project's
      # repository_path (scripts/onboard.sh does this for you).
      - ${SENTINEL_WORKSPACE:-./workspace}:/workspace:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SENTINEL_RUNNER_HOST_WORKSPACE_DIR:-./runner-workspaces}:/runner-workspaces
      - sentinel-artifacts:/data/artifacts
      - sentinel-fix-workspaces:/data/fix-workspaces
      - ${SENTINEL_KUBE_CONFIG_HOST_PATH:-/dev/null}:/kube/config:ro
    ports:
      - "127.0.0.1:8080:8080"

  sentinel-web:
    image: ${SENTINEL_IMAGE_REGISTRY:-ghcr.io/tolgahan0}/e2e-sentinel-web:${SENTINEL_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - sentinel-api
    environment:
      SENTINEL_API_URL: "http://sentinel-api:8080"
    ports:
      - "9090:9090"

volumes:
  sentinel-postgres-data:
  sentinel-artifacts:
  sentinel-fix-workspaces:
