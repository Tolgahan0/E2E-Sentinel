name: Dependency scan

# Spec §9 Production Hardening "Dependency scanning". Runs on every push
# and pull request against main, plus a weekly schedule so newly
# disclosed vulnerabilities in already-pinned dependencies are caught
# even without a code change triggering the workflow.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  go-vuln-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # Scoped to production dependencies: eslint-config-next currently
      # bundles its own pinned, older eslint-plugin-react/minimatch
      # chain carrying a brace-expansion advisory with no fix released
      # upstream yet (confirmed: bumping eslint to the version npm
      # audit suggests breaks eslint-config-next's rules outright, and
      # no newer eslint-config-next exists). It's lint-tooling-only —
      # never part of the built app - so it doesn't belong in a
      # production supply-chain gate. --omit=dev re-includes it the
      # moment an upstream fix ships and this override is dropped.
      - run: npm audit --omit=dev --audit-level=high
