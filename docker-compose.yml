name: e2e-sentinel

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set, see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
    volumes:
      - sentinel-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinel}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:6379:6379"

  # A Docker-managed named volume is created root-owned. sentinel-api's
  # distroless image has no shell/chown and runs as a fixed non-root
  # user (uid/gid 65532 — distroless's standard "nonroot"), so it can
  # never fix this itself; a disposable init container does it once,
  # before sentinel-api starts.
  artifacts-init:
    image: busybox:1.36
    command: ["chown", "-R", "65532:65532", "/data/artifacts"]
    volumes:
      - sentinel-artifacts:/data/artifacts

  # Same rationale as artifacts-init, for the disposable copies Phase 8
  # applies a fix proposal's diff to (spec §15.2 "Apply in temporary
  # workspace") — never the real repository, which stays under
  # ./workspace until an explicit apply-repository call.
  fix-workspaces-init:
    image: busybox:1.36
    command: ["chown", "-R", "65532:65532", "/data/fix-workspaces"]
    volumes:
      - sentinel-fix-workspaces:/data/fix-workspaces

  sentinel-api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    restart: unless-stopped
    # sentinel-api runs as a non-root user (see Dockerfile.api), but the
    # Docker socket it needs for Phase 5 test execution is owned by a
    # root-only group even when bind-mounted (Docker Desktop exposes it
    # as root:root, mode 660). Adding the container to that group grants
    # socket access via standard Unix permissions WITHOUT running the
    # process as root or granting any other root capability. On a Linux
    # host with rootful Docker, the socket is usually root:docker instead
    # — set SENTINEL_DOCKER_GID to that group's actual GID there.
    group_add:
      - "${SENTINEL_DOCKER_GID:-0}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      artifacts-init:
        condition: service_completed_successfully
      fix-workspaces-init:
        condition: service_completed_successfully
    environment:
      SENTINEL_HTTP_ADDR: ":8080"
      SENTINEL_DATABASE_URL: "postgres://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sentinel}?sslmode=disable"
      SENTINEL_REDIS_ADDR: "redis:6379"
      SENTINEL_MIGRATIONS_DIR: "/app/migrations"
      SENTINEL_LOG_LEVEL: ${SENTINEL_LOG_LEVEL:-info}
      SENTINEL_ENVIRONMENT: ${SENTINEL_ENVIRONMENT:-local}
      # Phase 5 test execution: sentinel-api launches disposable runner
      # containers via the mounted socket below (Docker-outside-of-
      # Docker), so bind-mount sources must be given as HOST paths — see
      # docs/RUNNER_ISOLATION.md. `make up` computes and passes this.
      SENTINEL_RUNNER_HOST_WORKSPACE_DIR: ${SENTINEL_RUNNER_HOST_WORKSPACE_DIR:?run via 'make up', which sets this to an absolute host path}
      # docker | local | auto (default) — see docs/RUNNER_ISOLATION.md.
      # Left at its default here: with SENTINEL_RUNNER_HOST_WORKSPACE_DIR
      # always set (line above) and this same daemon always reachable,
      # "auto" already resolves to "docker" for every Compose-based
      # deployment — local mode's real use case is running sentinel-api
      # outside Docker entirely (docs/LOCAL_DEVELOPMENT.md).
      SENTINEL_EXECUTION_MODE: ${SENTINEL_EXECUTION_MODE:-auto}
      # Phase 6 AI providers: optional. Unset means provider API keys
      # cannot be stored, but every other feature (including configuring
      # a keyless local Ollama provider) still works — spec §16.6
      # "No-AI Mode". Generate with `openssl rand -base64 32`.
      SENTINEL_SECRET_ENCRYPTION_KEY: ${SENTINEL_SECRET_ENCRYPTION_KEY:-}
      # Phase 9 RBAC: optional, defaults to disabled — every route
      # behaves exactly as in Phases 0-8 unless explicitly turned on. See
      # docs/SECURITY_MODEL.md.
      SENTINEL_AUTH_ENABLED: ${SENTINEL_AUTH_ENABLED:-false}
      SENTINEL_ADMIN_EMAIL: ${SENTINEL_ADMIN_EMAIL:-}
      SENTINEL_ADMIN_PASSWORD: ${SENTINEL_ADMIN_PASSWORD:-}
      # Phase 10 Kubernetes discovery: optional, defaults to disabled.
      # Set SENTINEL_KUBE_CONFIG_HOST_PATH (below, a host file) to mount
      # a kubeconfig and point this at its in-container path. See
      # docs/KUBERNETES_DISCOVERY.md.
      SENTINEL_KUBE_CONFIG_PATH: ${SENTINEL_KUBE_CONFIG_PATH:-}
      SENTINEL_KUBE_NAMESPACE: ${SENTINEL_KUBE_NAMESPACE:-}
    volumes:
      - ./migrations:/app/migrations:ro
      # Target repositories to discover/test must be reachable inside this
      # container. Place or symlink them under ./workspace on the host,
      # then use /workspace/<name> as a project's repository_path. See
      # docs/LOCAL_DEVELOPMENT.md. Read-only by default — every phase
      # through 7 only ever reads it. Phase 8's apply-repository is the
      # ONE path that needs to write here; it will fail with a clear
      # permission error against a read-only mount. To use it, change
      # this to `:rw` yourself, understanding that apply-repository then
      # writes to your real project files after an explicit approval —
      # see docs/FIX_PROPOSALS.md.
      - ${SENTINEL_WORKSPACE:-./workspace}:/workspace:ro
      # Required for Phase 5 (test execution) and optional Phase 2 live
      # container status. Mounting the Docker socket grants sentinel-api
      # extensive host capability — this is a deliberate, documented
      # trade-off (see docs/RUNNER_ISOLATION.md, docs/DOCKER_DISCOVERY.md)
      # in exchange for the simplest possible disposable-runner setup.
      # Prefer a restricted socket proxy for any shared/production host.
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared workspace for generated test specs — bind-mounted here so
      # sentinel-api can write files, and AGAIN into each disposable
      # runner container by the host daemon (hence needing the host path
      # above, not just this container-local one).
      - ${SENTINEL_RUNNER_HOST_WORKSPACE_DIR:-./runner-workspaces}:/runner-workspaces
      - sentinel-artifacts:/data/artifacts
      - sentinel-fix-workspaces:/data/fix-workspaces
      # Phase 10 Kubernetes discovery: optional. Mounts a placeholder
      # (/dev/null) unless SENTINEL_KUBE_CONFIG_HOST_PATH is set to a
      # real kubeconfig file on the host, in which case also set
      # SENTINEL_KUBE_CONFIG_PATH=/kube/config above. See
      # docs/KUBERNETES_DISCOVERY.md.
      - ${SENTINEL_KUBE_CONFIG_HOST_PATH:-/dev/null}:/kube/config:ro
    ports:
      - "127.0.0.1:8080:8080"

  # Build-only: never started by `docker compose up`. `make up` runs
  # `docker compose build playwright-runner` first so the image tag
  # SENTINEL_RUNNER_IMAGE expects already exists — sentinel-api never
  # pulls or builds it itself (spec §11's isolation model assumes a
  # pre-built, trusted runner image).
  playwright-runner:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.runner-playwright
    image: e2e-sentinel-playwright-runner:latest
    profiles: ["build-only"]

  # Same build-only pattern as playwright-runner, for the Phase 11
  # WebSocket adapter (spec §25) — a much smaller image (plain Node,
  # no browser stack) since a WebSocket smoke test needs neither
  # Chromium/Firefox/WebKit nor Playwright itself.
  websocket-runner:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.runner-websocket
    image: e2e-sentinel-websocket-runner:latest
    profiles: ["build-only"]

  sentinel-web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - sentinel-api
    environment:
      SENTINEL_API_URL: "http://sentinel-api:8080"
    ports:
      - "9090:9090"

volumes:
  sentinel-postgres-data:
  sentinel-artifacts:
  sentinel-fix-workspaces:
